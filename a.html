<html>
    <body>
        <h1> if else if in javascript</h1>
        <script>
            let marks=75;
            let grade;
            if(marks>=90){
                grade="A";
            }
            else if(marks>=80){
                grade="B";
            }
            else if(marks>=70){
                grade="C";
            }
            else if(marks>=60){
                grade="D";
            }
            else{
                grade="F";
            }
            document.write("marks="+marks+"<br>"+"grade="+grade);
        </script>
    </body>
</html>
