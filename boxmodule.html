<!DOCTYPE html>
<head>
    <title>box-module example</title>
    <style>
        *{
            box-sizing:border-box;
        }
        body{
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            background-color:burlywood;
            padding:10px;
        }
        .box{
            width:300px;
            padding:20px;
            border:4px solid navy;
            margin:20px auto;
            background-color:brown;
            text-align:center;

        }
    </style>
</head>
<body>
    <h1>box-model program</h1>
    <p>learning html</p>
    <div class="box">
        <h2>student profile</h2>
        <p>learning html</p>
    </div>
</body>
</html>
